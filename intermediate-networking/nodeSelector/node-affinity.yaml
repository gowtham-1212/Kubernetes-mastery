# ==========================================
# DEPLOYMENT WITH SOFT NODE AFFINITY
# ==========================================
# [API SERVER]: Validates and stores the deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-io-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: affinity-io-app
  template:
    metadata:
      labels:
        app: affinity-io-app
    spec:
      containers:
      - name: app
        image: high-io-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
      
      # ==========================================
      # 🚨 THE AFFINITY BLOCK 🚨
      # ==========================================
      affinity:
        nodeAffinity:
          # [SCHEDULER]: "preferred" means this is a soft rule. "IgnoredDuringExecution" means 
          # if someone removes the SSD label later, don't kill the pod currently running there.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100 # [SCHEDULER]: Adds 100 points to any node that matches this rule.
            preference:
              matchExpressions:
              - key: disktype
                operator: In # [SCHEDULER]: The value of 'disktype' must be IN the following list.
                values:
                - ssd