# ==========================================
# DEPLOYMENT WITH NODESELECTOR
# ==========================================
# [API SERVER]: Receives this manifest, validates the syntax, and saves the desired state to [ETCD].
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-io-deployment
spec:
  # [CONTROLLER MANAGER]: Sees desired replicas is 2. Requests 2 new Pods from the API Server.
  replicas: 2
  selector:
    matchLabels:
      app: high-io-app
  template:
    metadata:
      labels:
        app: high-io-app
    spec:
      containers:
      - name: app
        image: high-io-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
      
      # ==========================================
      # 🚨 ADVANCED SCHEDULING BLOCK 🚨
      # ==========================================
      # [SCHEDULER]: This is the star of this operation. When the Scheduler sees this Pod, 
      # it filters out EVERY node in the cluster that does not have the exact label "disktype: ssd".
      # If no nodes have this label, the [SCHEDULER] leaves the Pod in a "Pending" state forever.
      nodeSelector:
        disktype: ssd