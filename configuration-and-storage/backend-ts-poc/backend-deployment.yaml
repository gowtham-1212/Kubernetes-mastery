---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ts-backend
  template:
    metadata:
      labels:
        app: ts-backend
    spec:
      containers:
      - name: ts-backend
        image: backend-ts-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: POSTGRES_HOST
          value: "postgres-service"   # Connects via internal K8s DNS
        - name: POSTGRES_PORT
          value: "5432"
        envFrom:
        - configMapRef:
            name: postgres-config    # Injects POSTGRES_USER & POSTGRES_DB
        - secretRef:
            name: postgres-secret    # Injects POSTGRES_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: ts-backend-service
spec:
  type: ClusterIP
  selector:
    app: ts-backend
  ports:
    - port: 80
      targetPort: 3000